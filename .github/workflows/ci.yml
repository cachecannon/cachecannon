name: CI

on:
  push:
    branches: [main, '*.*.x']
  pull_request:
    branches: [main, '*.*.x']

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets -- -D warnings

  doc:
    name: Doc (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: RUSTDOCFLAGS="-D warnings" cargo doc --no-deps

  audit:
    name: Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@cargo-audit
      - run: cargo audit

  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # ubuntu-latest (kernel 6.17) charges each worker's io_uring rings, about
      # 2.5 MiB at ringline's defaults, to RLIMIT_MEMLOCK summed over the user's
      # processes, and the runner's limit is 8 MiB. Tests run in parallel, so
      # the limit is lifted, in the same shell as the tests.
      - run: |
          if [ "$RUNNER_OS" = Linux ]; then sudo prlimit --pid $$ --memlock=unlimited:unlimited; fi
          cargo test --all

  test-release:
    name: Test (release)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # One build job at a time. Under the release profile (fat LTO, one
      # codegen unit, debug info) one test binary's build peaked at 8.9 GB
      # resident on macOS, and the runner has 16 GB. With the default of one
      # job per CPU (4), this job was killed mid-build (exit 143) twice, which
      # we take to be memory exhaustion.
      - run: |
          sudo prlimit --pid $$ --memlock=unlimited:unlimited
          cargo test --all --release -j 1
